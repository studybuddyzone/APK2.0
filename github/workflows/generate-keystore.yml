name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 \
            -validity 10000 -alias studybuddyzonemanager \
            -storepass "StudyBuddyManager@2026" -keypass "StudyBuddyManager@2026" \
            -dname "CN=StudyBuddyZoneManager, OU=Dev, O=Xevrontech, L=City, ST=State, C=IN"

      - name: Convert to base64
        run: base64 -w 0 release.jks > release_base64.txt

      - name: Upload keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.jks
            release_base64.txt
